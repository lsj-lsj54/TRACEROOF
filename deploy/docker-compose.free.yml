# 低配部署：MySQL + Redis（必需）+ 后端 + 前端
#
# 适用于 2 核 2 GiB、单实例、低并发环境。与完整版相比，进一步收紧 MySQL、Redis 和 JVM，
# 但不删除 Redis：Sa-Token 登录会话、分布式锁、限流和布隆过滤器都依赖它。
# 1 GiB 或更小机器建议把 MySQL / Redis 外置，不要靠删除核心依赖换取“能启动”。

services:
  mysql:
    image: mysql:8.0
    container_name: evidence-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: evidence
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=96M
      - --performance-schema=OFF
      - --max-connections=40
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks: [app-net]

  redis:
    image: redis:7-alpine
    container_name: evidence-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Shanghai
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "128mb"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks: [app-net]

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: evidence-app:${EVIDENCE_TAG:-latest}
    container_name: evidence-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/evidence?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_REDIS_TIMEOUT: 1000ms
      SPRING_REDIS_CONNECT_TIMEOUT: 1000ms
      COS_CLIENT_HOST: ${COS_HOST}
      COS_CLIENT_SECRET_ID: ${COS_SECRET_ID}
      COS_CLIENT_SECRET_KEY: ${COS_SECRET_KEY}
      COS_CLIENT_REGION: ${COS_REGION}
      COS_CLIENT_BUCKET: ${COS_BUCKET}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-*}
      MYBATIS_PLUS_CONFIGURATION_LOG_IMPL: org.apache.ibatis.logging.nologging.NoLoggingImpl
      JAVA_OPTS: "-Xms96m -Xmx384m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks: [app-net]

  front:
    build:
      context: ..
      dockerfile: Dockerfile.front
    image: evidence-front:${EVIDENCE_TAG:-latest}
    container_name: evidence-front
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks: [app-net]

volumes:
  mysql-data:
  redis-data:

networks:
  app-net:
    driver: bridge
